name: QElectroTech integration build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "src/electrocad/**"
      - "patches/upstream/**"
      - ".github/workflows/qelectrotech-upstream-build.yml"
      - "docs/INTEGRATION_STRATEGY.md"
  push:
    branches:
      - main
      - feature/qelectrotech-integration
    paths:
      - "CMakeLists.txt"
      - "src/electrocad/**"
      - ".github/workflows/qelectrotech-upstream-build.yml"
      - "docs/INTEGRATION_STRATEGY.md"

permissions:
  contents: read

jobs:
  windows-integration:
    name: Windows x64 integration build (MSYS2 UCRT64)
    runs-on: windows-latest
    steps:
      - name: Checkout ElectroCAD
        uses: actions/checkout@v7

      - name: Checkout pinned QElectroTech source and submodules
        uses: actions/checkout@v7
        with:
          repository: qelectrotech/qelectrotech-source-mirror
          ref: b49ce16c42b99e458e38935f39b919d56582e54e
          path: upstream
          submodules: recursive
          fetch-depth: 0

      - name: Install MSYS2 toolchain and dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-translations
            mingw-w64-ucrt-x86_64-qt6-pdf
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-kwidgetsaddons
            mingw-w64-ucrt-x86_64-kcoreaddons
            mingw-w64-ucrt-x86_64-extra-cmake-modules
            mingw-w64-ucrt-x86_64-angleproject
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-hidapi

      - name: Record installed MSYS2 package versions
        shell: msys2 {0}
        run: |
          set -euo pipefail
          pacman -Q | sort > "$GITHUB_WORKSPACE/msys2-packages.txt"
          echo "Recorded $(wc -l < "$GITHUB_WORKSPACE/msys2-packages.txt") installed packages"

      - name: Verify source and submodule revisions
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/upstream"
          test "$(git rev-parse HEAD)" = "b49ce16c42b99e458e38935f39b919d56582e54e"
          git submodule status --recursive

      - name: Apply ElectroCAD editor integration patch
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/upstream"
          git apply --check "$GITHUB_WORKSPACE/patches/upstream/0001-electrocad-diagram-topology.patch"
          git apply "$GITHUB_WORKSPACE/patches/upstream/0001-electrocad-diagram-topology.patch"
          git diff --check

      - name: Configure ElectroCAD integration tree
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build" -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_PREFIX_PATH=/ucrt64             -DQt6_DIR=/ucrt64/lib/cmake/Qt6             -DQT_VERSION_MAJOR=6             -DBUILD_WITH_KF=ON             -DBUILD_KF=OFF             -DPACKAGE_TESTS=ON             -DCMAKE_POLICY_DEFAULT_CMP0077=NEW             -DCMAKE_POLICY_VERSION_MINIMUM=3.5             -DQET_EXPORT_PROJECT_DB=ON             -DQET_ENABLE_SPACEMOUSE=ON             -DQET_SPACEMOUSE_BACKEND=hid             -DSQLite3_INCLUDE_DIR=/ucrt64/include             -DSQLite3_LIBRARY=/ucrt64/lib/libsqlite3.dll.a

      - name: Verify integrated application target
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake --build "$GITHUB_WORKSPACE/build" --target help | grep -E 'qelectrotech(_objects)?'

      - name: Build
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake --build "$GITHUB_WORKSPACE/build" --parallel "$(nproc)"

      - name: Run unit tests
        shell: msys2 {0}
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          ctest --test-dir "$GITHUB_WORKSPACE/build" --output-on-failure --timeout 900

      - name: Verify executable
        shell: msys2 {0}
        run: |
          set -euo pipefail
          exe="$(find "$GITHUB_WORKSPACE/build" -maxdepth 5 -iname qelectrotech.exe | head -1)"
          test -n "$exe"
          test "$(stat -c%s "$exe")" -gt 100000
          echo "Integrated build executable: $exe"
          echo "Size: $(stat -c%s "$exe") bytes"

      - name: Upload integration test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electrocad-qelectrotech-integration-win64
          path: |
            build/**/qelectrotech.exe
            msys2-packages.txt
          if-no-files-found: error
          retention-days: 7
